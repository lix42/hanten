[package]
name = "nc"
version = "0.1.0"
edition = "2024"

# The product is Hanten; the crate stays `nc` (see CLAUDE.md's naming boundary).
# Renaming the binary here rather than the package keeps `NC_VERSION`
# (`CARGO_PKG_VERSION`) and the `nc_version` report field untouched.
[[bin]]
name = "hanten"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# The telemetry event's random `event_id` (`telemetry::EventId`).
getrandom = "0.3.4"
jpeg-encoder = "0.7.1"
lcms2 = "6.1.1"
lcms2-sys = "4.0.7"
libc = "0.2"
rayon = "1.12.0"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiff = "0.11.3"
# The telemetry uploader's HTTPS client (`telemetry::net`): blocking, no async
# runtime, rustls with bundled webpki roots so no system TLS library is linked.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Validates the telemetry upload corpus against its JSON Schema
# (`contracts/telemetry/upload-v1`). Chosen over `jsonschema`, whose minimum versions
# bump crates the shipped binary locks (`zmij`).
boon = "0.6.1"
# The "ordinary reader" that opens a gain-map JPEG in `io::iso_gain_map`'s tests and
# the e2e gain-map test. JPEG only: the default formats build an AVIF encoder.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Reused by the e2e tests (same version as the runtime dep, so `Cargo.lock` is
# unchanged) to synthesize TIFF fixtures on the fly and to decode what the binary
# wrote.
tiff = "0.11.3"
