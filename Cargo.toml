[package]
name = "nc"
version = "0.1.0"
edition = "2024"

# The product is Hanten; the crate stays `nc` (see CLAUDE.md's naming boundary).
# Renaming the binary here rather than the package keeps `NC_VERSION`
# (`CARGO_PKG_VERSION`) and the `nc_version` report field untouched.
[[bin]]
name = "hanten"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# The telemetry event's random `event_id` (`telemetry::EventId`). Already locked
# through `jobserver` and `rand_core`, so no new crate.
getrandom = "0.3.4"
image = "0.25.10"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
# AV1 encoder for `io::avif`. The crate vendors libaom's source and links it
# statically with no network access, so the exact codec is pinned by
# `Cargo.lock`, and nc carries no in-repo libaom snapshot. nc writes the AVIF
# container itself (see `io::avif`), so no libavif dependency exists; the decoder
# half is a dev-dependency, since the product only ever encodes.
libaom-sys = { version = "0.17.2", default-features = false, features = [
    "av1_encoder",
] }
lcms2 = "6.1.1"
lcms2-sys = "4.0.7"
libc = "0.2"
palette = "0.7.6"
rayon = "1.12.0"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiff = "0.11.3"

[dev-dependencies]
# Enables libaom's decoder for `io::avif`'s round-trip tests only. Resolver v3
# keeps dev-dependency features out of a plain `cargo build`, so the shipped
# binary stays encoder-only. Note this decoder shares an implementation with the
# encoder, so it verifies self-consistency, not conformance — the independent
# dav1d/`avifdec` decode the task requires belongs to the codec-bounds work.
libaom-sys = { version = "0.17.2", default-features = false, features = [
    "av1_decoder",
] }
# Reused by the e2e tests (same version as the runtime dep, so `Cargo.lock` is
# unchanged) to synthesize TIFF fixtures on the fly and to decode what the binary
# wrote.
tiff = "0.11.3"
