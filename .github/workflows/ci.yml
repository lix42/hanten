name: CI

# Lint, build, and unit-test every PR (and pushes to main so the default
# branch always has a status to gate on).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: lint / build / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      # cargo never warns on a declared-but-unused crate. machete reads the source,
      # so it cannot see a runtime dependency only tests use; review catches that.
      # Same answer on both OSes, so run it once.
      - name: Install cargo-machete
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2

      - name: Unused dependencies
        if: runner.os == 'Linux'
        run: cargo machete

      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features --verbose

      # No other gate reads doc comments, so a renamed item's dangling intra-doc
      # link would otherwise pass everything above.
      - name: Docs (warnings = errors)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # Pinned to an exact release: this action publishes floating major tags only
      # through v7, so `@v10` would not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install analysis dependencies
        # `nctool metrics` and `acceptance` read output pixels and need
        # numpy/tifffile/Pillow; the rest of the toolkit is stdlib-only. A venv,
        # not `pip install --user`: both runner images ship an externally-managed
        # interpreter (PEP 668), which refuses a --user install outright, and a
        # venv is also the workflow
        # scripts/analysis/README.md documents locally — one shape, not two.
        #
        # `--python 3.12` is stated rather than inherited. `uv venv` otherwise
        # picks whatever interpreter it finds first, which differs between the two
        # runner images and again on a contributor's machine; naming it is what
        # makes the analysis suite run on one interpreter everywhere. uv fetches
        # that version itself, so it does not depend on the image shipping it.
        run: |
          uv venv --python 3.12
          uv pip install --quiet -r scripts/analysis/requirements.txt

      - name: Analysis and harness tests
        # NCTOOL_REQUIRE_DEPS turns a missing install into a failure rather than
        # ~30 silent skips under a green `ok`.
        env:
          NCTOOL_REQUIRE_DEPS: "1"
        run: PYTHONPATH=scripts/analysis .venv/bin/python -m unittest discover -s scripts/analysis -p "test_*.py"

      - name: Test
        run: cargo test --all-features --verbose

  # The review app is a self-contained tool with its own toolchain (Vite+), so it
  # gates separately rather than joining the Rust matrix — a Rust change cannot
  # break it and vice versa. Linux only: it builds no native code and produces the
  # same bundle everywhere, so a second OS would buy nothing.
  review-app:
    name: review-app (check / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/review-app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Vite+ requires ^20.19 || ^22.18 || >=24.11.
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `vp check` is format + lint + type-check in one pass.
      - name: Check (format, lint, types)
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The telemetry ingestion Worker (services/telemetry-ingest) gates on its own
  # toolchain, like the review app: its tests run in workerd with a local D1 and
  # read the same contracts/telemetry/upload-v1/ corpus the Rust tests do.
  telemetry-ingest:
    name: telemetry-ingest (check / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telemetry-ingest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (format, types, deploy contract)
        run: pnpm check

      - name: Test
        run: pnpm test
